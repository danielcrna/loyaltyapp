# Alternativa gratuita a Vercel Cron: ejecuta las automatizaciones diarias (cumpleaños, recordatorios, cupones vencidos).
# Configura los secretos APP_URL y CRON_SECRET en el repositorio (Settings → Secrets and variables → Actions)
# y la variable ENABLE_CRON=true (pestaña Variables) para activarlo.
name: Automatizaciones diarias
on:
  schedule:
    - cron: "0 15 * * *" # 9:00 am hora del centro de México
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CRON == 'true' }}
    steps:
      # Bloque literal: el ": " de "Authorization: Bearer" dentro de un valor sin comillas invalida el YAML.
      - name: Ejecutar automatizaciones
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
